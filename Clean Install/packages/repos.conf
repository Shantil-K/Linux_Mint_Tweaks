# Third-party apt repositories, one per line:
#   list file | key file (in keyrings/) | where the key goes | base | apt line | packages | key URL
# base: any = Mint and LMDE; ubuntu = Ubuntu-based Mint only (PPAs).
# File names and key paths match what the vendors' own packages use, so their updates don't
# add duplicate entries. A .sources file name is written in deb822 format.
# In the apt line: @KEY@ = key path, @CODENAME@ = noble/trixie..., @DISTRO@ = ubuntu/debian,
# @OBS@ = openSUSE build name (xUbuntu_24.04, Debian_13).
# restore.sh keeps a repo only if apt can read it on the new release. If the bundled key has been
# replaced by the vendor, it downloads the current one from the key URL and tries again.
helium.list | helium.gpg | /usr/share/keyrings/helium.gpg | any | deb [arch=amd64 signed-by=@KEY@] https://pkg.helium.computer/deb stable main | helium-bin
vscode.sources | microsoft.gpg | /usr/share/keyrings/microsoft.gpg | any | deb [arch=amd64 signed-by=@KEY@] https://packages.microsoft.com/repos/code stable main | code | https://packages.microsoft.com/keys/microsoft.asc
github-cli.list | githubcli-archive-keyring.gpg | /etc/apt/keyrings/githubcli-archive-keyring.gpg | any | deb [arch=amd64 signed-by=@KEY@] https://cli.github.com/packages stable main | gh | https://cli.github.com/packages/githubcli-archive-keyring.gpg
cloudflared.list | cloudflare-public-v2.gpg | /usr/share/keyrings/cloudflare-public-v2.gpg | any | deb [arch=amd64 signed-by=@KEY@] https://pkg.cloudflare.com/cloudflared any main | cloudflared | https://pkg.cloudflare.com/cloudflare-public-v2.gpg
tailscale.list | tailscale-archive-keyring.gpg | /usr/share/keyrings/tailscale-archive-keyring.gpg | any | deb [signed-by=@KEY@] https://pkgs.tailscale.com/stable/@DISTRO@ @CODENAME@ main | tailscale | https://pkgs.tailscale.com/stable/@DISTRO@/@CODENAME@.noarmor.gpg
waterfox.list | waterfox.gpg | /usr/share/keyrings/waterfox.gpg | any | deb [signed-by=@KEY@] https://download.opensuse.org/repositories/isv:/BrowserWorks/@OBS@/ / | waterfox | https://download.opensuse.org/repositories/isv:/BrowserWorks/@OBS@/Release.key
pgadmin4.list | packages-pgadmin-org.gpg | /usr/share/keyrings/packages-pgadmin-org.gpg | any | deb [signed-by=@KEY@] https://ftp.postgresql.org/pub/pgadmin/pgadmin4/apt/@CODENAME@ pgadmin4 main | pgadmin4 | https://www.pgadmin.org/static/packages_pgadmin_org.pub
firefoxpwa.list | firefoxpwa.gpg | /etc/apt/keyrings/firefoxpwa.gpg | any | deb [signed-by=@KEY@] https://packagecloud.io/filips/FirefoxPWA/any any main | firefoxpwa | https://packagecloud.io/filips/FirefoxPWA/gpgkey
google-earth-pro.list | google-earth-pro.gpg | /etc/apt/trusted.gpg.d/google-earth-pro.gpg | any | deb [arch=amd64] http://dl.google.com/linux/earth/deb/ stable main | google-earth-pro-stable | https://dl.google.com/linux/linux_signing_key.pub
papirus-papirus-@CODENAME@.list | papirus-papirus.gpg | /etc/apt/keyrings/papirus-papirus-@CODENAME@.gpg | ubuntu | deb [signed-by=@KEY@] https://ppa.launchpadcontent.net/papirus/papirus/ubuntu @CODENAME@ main | papirus-icon-theme papirus-folders
zhangsongcui3371-fastfetch-@CODENAME@.list | zhangsongcui3371-fastfetch.gpg | /etc/apt/keyrings/zhangsongcui3371-fastfetch-@CODENAME@.gpg | ubuntu | deb [signed-by=@KEY@] https://ppa.launchpadcontent.net/zhangsongcui3371/fastfetch/ubuntu @CODENAME@ main | fastfetch
ubuntuhandbook1-nvidia-vaapi-@CODENAME@.list | ubuntuhandbook1-nvidia-vaapi.gpg | /etc/apt/keyrings/ubuntuhandbook1-nvidia-vaapi-@CODENAME@.gpg | ubuntu | deb [signed-by=@KEY@] https://ppa.launchpadcontent.net/ubuntuhandbook1/nvidia-vaapi/ubuntu @CODENAME@ main | nvidia-vaapi-driver
